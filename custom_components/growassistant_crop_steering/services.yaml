reset_cycle:
  name: Reset cycle
  description: >-
    Reset managed P1 state switches and daily/cycle helpers for the configured
    GrowAssistant crop steering entry without touching the configured pump switch
    or input_boolean test helper.

start_p1:
  name: Start P1
  description: >-
    Turn on managed P1 state switches, backdate the integration-managed last-shot
    timestamp, mirror it to a legacy input_datetime helper when configured, and
    mirror P1 switch changes to legacy input_boolean helpers when present. This
    service does not turn on the pump.

complete_p1:
  name: Complete P1
  description: >-
    Capture the current averaged VWC as P2 Reference VWC, mark P1 complete, and
    deactivate P1. If no configured VWC sensor has a valid reading, no state is
    changed. This service does not control the pump.

set_last_shot_now:
  name: Set last shot now
  description: >-
    Set the integration-managed last-shot timestamp and optional shot type, then
    mirror the timestamp to a legacy input_datetime helper when one is configured.
    Omitting shot type records it as unknown.
  fields:
    shot_type:
      name: Shot type
      description: The type of shot that created the timestamp.
      required: false
      selector:
        select:
          options:
            - label: P1
              value: p1
            - label: P2
              value: p2
            - label: P3 Emergency
              value: p3_emergency

clear_last_shot:
  name: Clear last shot
  description: >-
    Clear the integration-managed last-shot timestamp and shot type. Legacy input_datetime
    helpers are left unchanged because Home Assistant input_datetime helpers
    cannot be emptied reliably.

stop_pump:
  name: Stop pump
  description: >-
    Turn off only the configured pump switch or input_boolean test helper as an explicit manual/safety stop.
