name: Crop Steering Simulation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to simulate
        required: true
        type: choice
        default: growassistant_hugo_synthetic_18_6.json
        options:
          - growassistant_hugo_synthetic_18_6.json
          - growassistant_hugo_field_capacity_18_6.json
          - growassistant_hugo_field_capacity_boundary_18_6.json
          - growassistant_hugo_p2_stress_18_6.json
          - growassistant_hugo_p2_time_boundary_18_6.json
          - growassistant_hugo_p2_min_interval_stress_18_6.json

permissions:
  contents: read

jobs:
  simulate:
    name: Grodan Hugo simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m pip check
          # 0.13.301 pins HA 2025.12.4; retain our tested 2025.12.5 baseline.
          # Supporting fixture dependencies are pinned in requirements-ci.txt.
          python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.301


      # The existing pytest harness uses fake hardware and forbids real HA services.
      - name: Run Grodan Hugo scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$SCENARIO" in
            growassistant_hugo_synthetic_18_6.json|growassistant_hugo_field_capacity_18_6.json|growassistant_hugo_field_capacity_boundary_18_6.json|growassistant_hugo_p2_stress_18_6.json|growassistant_hugo_p2_time_boundary_18_6.json|growassistant_hugo_p2_min_interval_stress_18_6.json) ;;
            *)
              echo "Unsupported scenario" >&2
              exit 1
              ;;
          esac
          python scripts/run-scenario.py \
            "tests/native_harness/scenarios/$SCENARIO" \
            --output work/scenario-hugo

      - name: Verify simulation outputs
        run: |
          test -s work/scenario-hugo/report.html
          test -s work/scenario-hugo/timeline.csv
          test -s work/scenario-hugo/events.json

      - name: Upload simulation results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-${{ inputs.scenario }}
          path: |
            work/scenario-hugo/report.html
            work/scenario-hugo/timeline.csv
            work/scenario-hugo/events.json
          if-no-files-found: error
