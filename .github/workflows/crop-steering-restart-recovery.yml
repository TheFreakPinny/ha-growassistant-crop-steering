name: Crop Steering Restart Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-recovery:
    name: Isolated restart and recovery safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m pip check
          # 0.13.301 pins HA 2025.12.4; retain our tested 2025.12.5 baseline.
          # Supporting fixture dependencies are pinned in requirements-ci.txt.
          python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.301


      # Both off_missing variants use the fixed fake pump and forbid real HA services.
      - name: Run restart and recovery safety tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/restart-recovery
          python -m pytest -v \
            tests/native_harness/test_simulation.py::test_crash_checkpoint_restores_without_replay_or_review_clearance \
            --junitxml=work/restart-recovery/junit.xml \
            2>&1 | tee work/restart-recovery/pytest.txt

      - name: Summarize restart and recovery results
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("work/restart-recovery")
          report_dir.mkdir(parents=True, exist_ok=True)
          junit = report_dir / "junit.xml"
          lines = [
              "# Restart and recovery safety results",
              "",
              "Isolated HA test instances with a fixed fake pump; real HA service dispatch is forbidden.",
              "",
              "Test: `tests/native_harness/test_simulation.py::test_crash_checkpoint_restores_without_replay_or_review_clearance`",
              "",
          ]
          if junit.is_file():
              root = ET.parse(junit).getroot()
              cases = list(root.iter("testcase"))
              lines += ["| Variant | Result | Duration (s) |", "| --- | --- | --- |"]
              for case in cases:
                  status = next(
                      (label for tag, label in (("error", "ERROR"), ("failure", "FAIL"), ("skipped", "SKIP"))
                       if case.find(tag) is not None),
                      "PASS",
                  )
                  lines.append(f"| `{case.get('name')}` | {status} | {case.get('time', '0')} |")
              lines += ["", f"Reported test cases: {len(cases)} (expected: 2, off_missing=False/True)."]
          else:
              lines += ["JUnit report unavailable: dependency installation or test startup may have failed. Check the job logs and pytest.txt, if present."]
          summary = "\n".join(lines) + "\n"
          (report_dir / "summary.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          if not junit.is_file():
              raise SystemExit("Expected JUnit report is missing")
          expected = {
              "test_crash_checkpoint_restores_without_replay_or_review_clearance[False]",
              "test_crash_checkpoint_restores_without_replay_or_review_clearance[True]",
          }
          if len(cases) != 2 or {case.get("name") for case in cases} != expected:
              raise SystemExit("Expected exactly both off_missing variants")
          if any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit("Both recovery variants must pass without skips")
          PYTHON

      - name: Upload restart and recovery reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crop-steering-restart-recovery
          path: |
            work/restart-recovery/junit.xml
            work/restart-recovery/pytest.txt
            work/restart-recovery/summary.md
          if-no-files-found: error
