name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.13 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m pip check
          # 0.13.301 pins HA 2025.12.4; retain our tested 2025.12.5 baseline.
          # Supporting fixture dependencies are pinned in requirements-ci.txt.
          python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.301

      - name: Run all tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: python -m pytest -q

      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check custom_components tests

      - name: Ruff formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff format --check custom_components tests

      - name: Compile Python
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m compileall -q custom_components tests

      - name: Check Git whitespace
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git show --format= --check "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
